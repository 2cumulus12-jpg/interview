<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>면접 관리 & 사전 알림 툴</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 980px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            padding: 32px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }
        .header h1 { font-size: 1.5rem; color: #0f172a; }
        .noti-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .noti-btn:hover { background-color: #2563eb; }

        .form-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) auto;
            gap: 12px;
            align-items: end;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 700; color: #475569; }
        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background: white;
            height: 42px;
        }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }
        .time-select-wrap { display: flex; gap: 6px; }
        .time-select-wrap select { flex: 1; }

        .form-actions {
            display: flex;
            gap: 6px;
        }
        .add-btn {
            background: #0f172a;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            height: 42px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .add-btn:hover { background: #334155; }
        .cancel-btn {
            background: #94a3b8;
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            height: 42px;
            display: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .cancel-btn:hover { background: #64748b; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        th { background: #f8fafc; color: #475569; font-weight: 700; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-wait { background: #e0f2fe; color: #0369a1; }
        .badge-alert { background: #fee2e2; color: #b91c1c; animation: blink 1s infinite; }
        .badge-done { background: #f1f5f9; color: #64748b; }

        @keyframes blink { 50% { opacity: 0.5; } }

        .table-btn-group {
            display: flex;
            gap: 6px;
        }
        .edit-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .edit-btn:hover { background: #e2e8f0; }
        .del-btn {
            background: transparent;
            border: 1px solid #fca5a5;
            color: #ef4444;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .del-btn:hover { background: #fee2e2; border-color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🗓️ 면접 일정 & 30분 전 알림 관리</h1>
        <button class="noti-btn" onclick="requestNotification()">🔔 브라우저 알림 활성화</button>
    </div>

    <!-- 면접 일정 입력 폼 -->
    <div class="form-card">
        <div class="form-group">
            <label>면접자 이름</label>
            <input type="text" id="candName" placeholder="예: (김지원) / 지원자">
        </div>
        <div class="form-group">
            <label>연락처</label>
            <input type="text" id="candPhone" placeholder="예: 010 1234 5678">
        </div>
        <div class="form-group">
            <label>지원 직무 / 비고</label>
            <input type="text" id="candRole" placeholder="예: 연구기획 / 1차 면접">
        </div>
        <div class="form-group">
            <label>면접 날짜</label>
            <input type="date" id="candDate">
        </div>
        <div class="form-group">
            <label>면접 시간 (5분 단위)</label>
            <div class="time-select-wrap">
                <select id="candHour"></select>
                <select id="candMinute"></select>
            </div>
        </div>
        <div class="form-actions">
            <button class="add-btn" id="submitBtn" onclick="handleSubmit()">등록</button>
            <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()">취소</button>
        </div>
    </div>

    <!-- 면접 리스트 테이블 -->
    <table>
        <thead>
            <tr>
                <th>면접자</th>
                <th>연락처</th>
                <th>직무 / 비고</th>
                <th>면접 일시</th>
                <th>알림 상태</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="interviewList"></tbody>
    </table>
</div>

<script>
    let interviews = JSON.parse(localStorage.getItem('interviews') || '[]');
    let editTargetId = null;

    // 이름 입력값 정제 (불필요한 괄호, 따옴표, 특수기호 제거)
    function sanitizeName(raw) {
        if (!raw) return '';
        return raw.replace(/[\(\)\[\]\{\}"'“”‘’<>\/\\_~*+]/g, '').replace(/\s{2,}/g, ' ').trim();
    }

    // 전화번호 정제 (숫자만 추출하여 010-XXXX-XXXX 형태로 자동 하이픈 포맷팅)
    function formatPhoneNumber(raw) {
        if (!raw) return '-';
        const nums = raw.replace(/\D/g, ''); // 숫자만 남기기
        
        if (nums.length === 11) {
            return nums.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
        } else if (nums.length === 10) {
            if (nums.startsWith('02')) {
                return nums.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
            }
            return nums.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
        } else if (nums.length === 9) {
            return nums.replace(/(\d{2})(\d{3})(\d{4})/, '$1-$2-$3');
        }
        
        return raw.trim() || '-';
    }

    function initTimeSelects() {
        const hourSelect = document.getElementById('candHour');
        const minuteSelect = document.getElementById('candMinute');
        hourSelect.innerHTML = '';
        minuteSelect.innerHTML = '';

        for (let h = 8; h <= 21; h++) {
            const val = String(h).padStart(2, '0');
            const opt = document.createElement('option');
            opt.value = val;
            opt.innerText = val + '시';
            if (h === 14) opt.selected = true;
            hourSelect.appendChild(opt);
        }

        for (let m = 0; m < 60; m += 5) {
            const val = String(m).padStart(2, '0');
            const opt = document.createElement('option');
            opt.value = val;
            opt.innerText = val + '분';
            minuteSelect.appendChild(opt);
        }

        resetDateField();
    }

    function resetDateField() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('candDate').value = `${y}-${m}-${d}`;
    }

    function requestNotification() {
        if (!("Notification" in window)) {
            alert("사용 중인 브라우저는 알림 기능을 지원하지 않습니다.");
            return;
        }
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                alert("알림이 활성화되었습니다! 면접 30분 전에 팝업이 울립니다.");
            } else {
                alert("알림 권한이 차단되어 있습니다. 주소창 좌측 설정에서 허용해 주세요.");
            }
        });
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
    }

    function handleSubmit() {
        let name = sanitizeName(document.getElementById('candName').value);
        let phone = formatPhoneNumber(document.getElementById('candPhone').value);
        let role = document.getElementById('candRole').value.trim();
        const dateStr = document.getElementById('candDate').value;
        const hour = document.getElementById('candHour').value;
        const minute = document.getElementById('candMinute').value;

        if (!name || !dateStr) {
            alert("이름과 면접 날짜는 필수로 입력해야 합니다.");
            return;
        }

        const fullTimeStr = `${dateStr}T${hour}:${minute}:00`;
        const timeVal = new Date(fullTimeStr).getTime();

        if (editTargetId !== null) {
            const target = interviews.find(item => item.id === editTargetId);
            if (target) {
                target.name = name;
                target.phone = phone;
                target.role = role;
                if (target.time !== timeVal) {
                    target.time = timeVal;
                    target.notified = false;
                }
            }
            cancelEdit();
        } else {
            const item = {
                id: Date.now(),
                name,
                phone,
                role,
                time: timeVal,
                notified: false
            };
            interviews.push(item);
            clearInputs();
        }

        interviews.sort((a, b) => a.time - b.time);
        saveAndRender();
    }

    function editInterview(id) {
        const target = interviews.find(item => item.id === id);
        if (!target) return;

        editTargetId = id;

        document.getElementById('candName').value = target.name;
        document.getElementById('candPhone').value = target.phone === '-' ? '' : target.phone;
        document.getElementById('candRole').value = target.role;

        const d = new Date(target.time);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        document.getElementById('candDate').value = `${y}-${m}-${day}`;

        document.getElementById('candHour').value = String(d.getHours()).padStart(2, '0');
        
        let min = Math.round(d.getMinutes() / 5) * 5;
        if (min >= 60) min = 55;
        document.getElementById('candMinute').value = String(min).padStart(2, '0');

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "수정 완료";
        submitBtn.style.backgroundColor = "#2563eb";
        document.getElementById('cancelBtn').style.display = "inline-block";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editTargetId = null;
        clearInputs();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "등록";
        submitBtn.style.backgroundColor = "#0f172a";
        document.getElementById('cancelBtn').style.display = "none";
    }

    function clearInputs() {
        document.getElementById('candName').value = '';
        document.getElementById('candPhone').value = '';
        document.getElementById('candRole').value = '';
        resetDateField();
    }

    function deleteInterview(id) {
        if (!confirm("정말 이 면접 일정을 삭제하시겠습니까?")) return;
        if (editTargetId === id) cancelEdit();
        interviews = interviews.filter(item => item.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('interviews', JSON.stringify(interviews));
        const tbody = document.getElementById('interviewList');
        tbody.innerHTML = '';

        if (interviews.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">등록된 면접 일정이 없습니다.</td></tr>';
            return;
        }

        const now = Date.now();

        interviews.forEach(item => {
            const diffMin = Math.round((item.time - now) / (1000 * 60));
            const dateObj = new Date(item.time);
            const dateString = dateObj.toLocaleString('ko-KR', { 
                month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' 
            });

            let statusBadge = '';
            if (diffMin <= 0) {
                statusBadge = '<span class="badge badge-done">면접 진행/종료</span>';
            } else if (diffMin <= 30) {
                statusBadge = `<span class="badge badge-alert">⚠️ 연락 필요 (${diffMin}분 전)</span>`;
            } else {
                statusBadge = `<span class="badge badge-wait">${diffMin}분 남음</span>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.phone || '-'}</td>
                <td>${item.role || '-'}</td>
                <td>${dateString}</td>
                <td>${statusBadge}</td>
                <td>
                    <div class="table-btn-group">
                        <button class="edit-btn" onclick="editInterview(${item.id})">수정</button>
                        <button class="del-btn" onclick="deleteInterview(${item.id})">삭제</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function checkReminders() {
        const now = Date.now();
        let updated = false;

        interviews.forEach(item => {
            const diffMin = (item.time - now) / (1000 * 60);

            if (diffMin <= 30 && diffMin > 0 && !item.notified) {
                item.notified = true;
                updated = true;

                playBeep();

                if (Notification.permission === "granted") {
                    new Notification("🔔 [면접 30분 전 알림]", {
                        body: `${item.name}님 면접이 30분 남았습니다.\n연락처: ${item.phone || '없음'}\n지금 연락을 진행해 주세요!`,
                        icon: "https://cdn-icons-png.flaticon.com/512/3652/3652191.png"
                    });
                } else {
                    alert(`[면접 30분 전 알림]\n${item.name}님(${item.phone}) 면접이 30분 남았습니다!`);
                }
            }
        });

        saveAndRender();
    }

    initTimeSelects();
    saveAndRender();
    setInterval(checkReminders, 10000);
</script>
</body>
</html>
